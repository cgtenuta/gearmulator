name: OsTIrus Windows (HardwareTI skin)

on:
  workflow_dispatch:
  push:
    branches: [ hardware-ti-skin ]

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Set up MSVC compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure (OsTIrus only, VST3 + standalone)
      run: >
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        -Dgearmulator_BUILD_JUCEPLUGIN=ON
        -Dgearmulator_BUILD_FX_PLUGIN=OFF
        -Dgearmulator_BUILD_JUCEPLUGIN_VST3=ON
        -Dgearmulator_BUILD_JUCEPLUGIN_VST2=OFF
        -Dgearmulator_BUILD_JUCEPLUGIN_CLAP=OFF
        -Dgearmulator_BUILD_JUCEPLUGIN_AU=OFF
        -Dgearmulator_BUILD_JUCEPLUGIN_LV2=OFF
        -Dgearmulator_SYNTH_OSTIRUS=ON
        -Dgearmulator_SYNTH_OSIRUS=OFF
        -Dgearmulator_SYNTH_VAVRA=OFF
        -Dgearmulator_SYNTH_XENIA=OFF
        -Dgearmulator_SYNTH_JE8086=OFF
        -Dgearmulator_SYNTH_NODALRED2X=OFF

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Collect VST3
      shell: pwsh
      run: |
        $found = Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 | Where-Object { $_.Name -match 'OsTIrus' } | Select-Object -First 1
        if (-not $found) { $found = Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 | Select-Object -First 1 }
        if (-not $found) { Get-ChildItem -Path build -Recurse -Filter *.vst3 | ForEach-Object { $_.FullName }; throw "no .vst3 bundle folder found" }
        Write-Host "Using $($found.FullName)"
        New-Item -ItemType Directory -Force out | Out-Null
        Copy-Item $found.FullName out\OsTIrus.vst3 -Recurse -Force
        Get-ChildItem out -Recurse | Select-Object -First 20 | ForEach-Object { $_.FullName }

    - name: Installer (Inno Setup)
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/ostirus_hardware.iss

    - uses: actions/upload-artifact@v4
      with:
        name: OsTIrus-HardwareTI-Windows
        path: |
          out/
          installer/Output/*.exe
